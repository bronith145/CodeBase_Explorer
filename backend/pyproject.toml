[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-explorer"
version = "0.1.0"
description = "Agentic GraphRAG Codebase Explorer"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "neo4j>=5.23",
  "qdrant-client>=1.12",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "pathspec>=0.12",
  "gitpython>=3.1",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-ollama>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_explorer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

